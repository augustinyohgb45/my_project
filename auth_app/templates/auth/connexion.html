{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "images/css/Login.css" %}">
    <title>Connexion</title>
</head>
<body style="background-image: url(/static/image/fond.jpeg); padding: 0; margin: 0; font-family: 'SF Pro Text'; font-weight: 500;">
    <div class="split-screen">
        <div class="left">
            <section class="copy">
                
            </section>
        </div>
        <div class="right">
            <form action="" method="POST">
                {% csrf_token %}
                <section class="copy">
                    <h2>Connexion</h2>
                    <div class="login-container">
                    </div>
                </section>

                <!-- Afficher les messages d'erreur -->
                {% if messages %}
                <div class="error-messages">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}

                <div class="input-container username">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-container password">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button class="signup-btn" type="submit">Connexion</button>
                <section class="copy legal">
                    {% comment %} <p>
                        <span class="small">En continuant, vous acceptez notre <br />
                        <a href="#">Politique de confidentialité</a> et <a href="#">Conditions d'utilisation</a></span>
                    </p> {% endcomment %}
                </section>
            </form>
        </div>
    </div>
    <script src="script.js" charset="utf-8"></script>
</body>
</html>
