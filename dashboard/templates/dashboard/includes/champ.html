<div class="form-group">
    <label for="{{ champ.id_for_label }}" class="font-weight-bold small text-gray-700">
        {{ champ.label }}{% if champ.field.required %} <span class="text-danger">*</span>{% endif %}
    </label>
    {{ champ }}
    {% for erreur in champ.errors %}<div class="invalid-feedback d-block">{{ erreur }}</div>{% endfor %}
    {% if champ.help_text %}<small class="form-text text-muted">{{ champ.help_text }}</small>{% endif %}
</div>
